stages:
  data_ingestion:
    cmd: python -m src.data_ingestion
    deps:
      - data/raw/train.csv
      - data/raw/test.csv
      - src/data_ingestion.py
      - utils/data_loader.py
      - utils/logger.py
      - configs/data_configs.py
    outs:
      - data/interim/ingested_train.csv
      - data/interim/ingested_test.csv

  data_manipulation:
    cmd: pythom -m src.data_manipulation 
    deps:
      - data/interim/ingested_train.csv
      - data/interim/ingested_test.csv 
      - src/data_manipulation.py 
      - utils/data_loader.py 
      - utils/logger.py
      - utils/params_loader.py 
      - configs/data_configs.py 

    params:
      - data_manipulation

    outs:
      - data/interim/manipulated_train_data.csv
      - data/interim/manipulated_test_data.csv 
      


